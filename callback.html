<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>K Bank — Signing in...</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --purple: #6B2FD9;
      --purple-pale: #F0EBFC;
      --dark: #1A1A2E;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--purple-pale);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      color: var(--dark);
    }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid rgba(107,47,217,0.2);
      border-top-color: var(--purple);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { font-size: 16px; color: #6B2FD9; font-weight: 500; }
    .error { color: #E53E3E; font-size: 14px; max-width: 400px; text-align: center; display: none; }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <p>Signing you in to K Bank...</p>
  <span class="error" id="errorMsg"></span>

  <script src="auth.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', async () => {
      try {
        await kbankHandleCallback();
      } catch (err) {
        console.error('[KBank Auth] Callback error:', err);
        const errorEl = document.getElementById('errorMsg');
        errorEl.textContent = 'Something went wrong signing you in. Redirecting...';
        errorEl.style.display = 'block';
        setTimeout(() => { window.location.href = 'index.html'; }, 2000);
      }
    });
  </script>
</body>
</html>
